name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 18
          - 22

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test gate
        run: npm run test:ci

      - name: Verify archived release tree
        run: |
          archive_dir="$(mktemp -d)"
          git archive HEAD | tar -x -C "$archive_dir"
          cd "$archive_dir"
          npm ci
          npm test -- --runInBand
          npm run test:e2e
